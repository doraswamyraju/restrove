<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B2D5B"/>
      <stop offset="78%" stop-color="#0B2D5B"/>
      <stop offset="100%" stop-color="#FF7A00"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark (Left) -->
  <g transform="translate(10, 8) scale(1.05)">
    <!-- Chef Hat -->
    <path d="M 22 56 C 12 50, 10 32, 24 24 C 24 10, 46 6, 50 16 C 56 6, 76 10, 76 24 C 90 32, 88 50, 78 56" 
          fill="none" stroke="url(#hatGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Swash -->
    <path d="M 16 75 C 32 78, 54 75, 78 56 C 58 64, 34 66, 22 64 Z" fill="url(#hatGrad)" />
    <!-- Letter R -->
    <path d="M 33 66 L 33 28 L 52 28 C 64 28, 64 43, 52 43 L 44 43 L 57 66 L 47 66 L 37 45 L 41 45 C 50 45, 50 35, 42 35 L 42 66 Z" fill="#0B2D5B" />
    <!-- Fork inside R -->
    <rect x="44.2" y="38" width="1.6" height="5" fill="#FFFFFF" rx="0.5"/>
    <path d="M 43 38 C 43 40, 47 40, 47 38 L 47 33 L 43 33 Z" fill="#FFFFFF"/>
    <rect x="43.9" y="30.5" width="0.7" height="4.5" fill="#0B2D5B"/>
    <rect x="45.4" y="30.5" width="0.7" height="4.5" fill="#0B2D5B"/>
  </g>

  <!-- Wordmark "Restrove" -->
  <text x="125" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-1">
    <tspan fill="#0B2D5B">Restro</tspan><tspan fill="#FF7A00">ve</tspan>
  </text>

  <!-- Subtitle with side lines -->
  <line x1="128" y1="88" x2="148" y2="88" stroke="#0B2D5B" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  <text x="156" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0B2D5B" letter-spacing="1.2">
    Restaurant POS &amp; Operations Platform
  </text>
  <line x1="452" y1="88" x2="472" y2="88" stroke="#0B2D5B" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
</svg>

