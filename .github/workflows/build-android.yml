name: Build Android APK (Chai Wala POS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Web Dependencies & Build
        run: |
          cd web
          npm ci || npm install
          npm run build
          npx cap sync android

      - name: Make Gradlew Executable
        run: |
          chmod +x web/android/gradlew

      - name: Build Android Debug APK with Gradle
        run: |
          cd web/android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChaiWala-POS-Android-APK
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
